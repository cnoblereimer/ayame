global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend http_front
    bind *:80
    default_backend http_back

backend http_back
    balance roundrobin
    # Replace with your actual upstream services
    server app1 app1:8080 check
    server app2 app2:8080 check

listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
