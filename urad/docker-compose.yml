name: pangolin-monitor
services:
  monitor:
    # Debian (glibc), NOT alpine. Pangolin's DNS answers AAAA queries for a
    # dns.static_records name with NXDOMAIN rather than NODATA, and musl
    # treats that as terminal for the whole lookup - so getaddrinfo fails
    # with EAI_NONAME even though the A record resolved fine. glibc ignores
    # the AAAA failure and uses the A record, which is what curl and
    # browsers do.
    image: python:3.12-slim
    container_name: pangolin-monitor
    restart: unless-stopped
    command: ["python", "-u", "/app/monitor.py"]
    volumes:
      - ./monitor.py:/app/monitor.py:ro
      - ./data:/data # probe history, so a restart doesn't lose the record
    environment:
      DASHBOARD: <DASHBOARD_DOMAIN>
      # Comma separated - add every resource hostname, same as ha-check.sh
      RESOURCES: <RESOURCE_DOMAIN>
      NODES: ayame=<AYAME_PUBLIC_IP>,michi=<MICHI_PUBLIC_IP>
      INTERVAL: "30"
      # Reads backend up/down straight from haproxy. Leave empty if the
      # stats port is not reachable from here.
      HAPROXY_STATS: http://<AYAME_PUBLIC_IP>:8404/stats;csv
    ports:
      # Published on the host so newt can reach it as a resource target.
      - "8080:8080"
