# Host-level WireGuard link carrying inter-node traffic (Postgres, Redis)
# so it never crosses the public internet in cleartext. Install to
# /etc/wireguard/wg-cluster.conf on ayame, then:
#
#   sudo apt install -y wireguard-tools
#   sudo chmod 600 /etc/wireguard/wg-cluster.conf
#   sudo systemctl enable --now wg-quick@wg-cluster
#   sudo wg show wg-cluster
#
# Generate this host's keypair with:
#   wg genkey | tee privatekey | wg pubkey > publickey
# The peer needs the PUBLIC key; the private key never leaves this host.
#
# Port 51821, not 51820: gerbil already publishes 51820/udp for the
# Pangolin tunnels. The 10.88.0.0/30 subnet avoids gerbil's 100.89.0.0/16
# and the LAN behind urad.

[Interface]
Address = 10.88.0.1/30
ListenPort = 51821
PrivateKey = <AYAME_WG_PRIVATE_KEY>

[Peer]
# michi
PublicKey = <MICHI_WG_PUBLIC_KEY>
AllowedIPs = 10.88.0.2/32
Endpoint = <MICHI_PUBLIC_IP>:51821
# Both ends have public IPs, but this keeps the session warm through any
# stateful firewall in between and re-establishes promptly after a restart.
PersistentKeepalive = 25
