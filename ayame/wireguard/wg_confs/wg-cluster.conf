# ayame's half of the inter-node WireGuard link, carrying Postgres and
# Redis traffic so it never crosses the public internet in cleartext.
# Brought up by the "wireguard" service in docker-compose.yml, which runs
# with network_mode: host - so the interface lands in the HOST network
# namespace, which is what lets docker publish Postgres and Redis on
# 10.88.0.1.
#
# Port 51821, not 51820: gerbil already publishes 51820/udp for Pangolin's
# own tunnels. 10.88.0.0/30 avoids gerbil's 100.89.0.0/16 and the LAN
# behind urad.
#
# NOTE: there is deliberately no PrivateKey line. The key is read at
# bring-up from a file that is gitignored, so this config can live in git
# and be deployed by pulling the repo. Create it once per host:
#
#   cd /opt/pangolin-cluster
#   umask 077 && wg genkey | sudo tee wireguard/privatekey | wg pubkey
#
# That prints the PUBLIC key - put it in michi's config as the peer key.

[Interface]
Address = 10.88.0.1/30
ListenPort = 51821
PostUp = wg set %i private-key /config/privatekey

[Peer]
# michi
PublicKey = <MICHI_WG_PUBLIC_KEY>
AllowedIPs = 10.88.0.2/32
Endpoint = <MICHI_PUBLIC_IP>:51821
# Both ends have public IPs, but this keeps the session warm through any
# stateful firewall in between and re-establishes promptly after a restart.
PersistentKeepalive = 25
