global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    tcp
    option  tcplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    # HAProxy resolves a server's hostname (e.g. "gerbil") once, at config
    # load time, by default - if that container happens to be mid-restart
    # right then, HAProxy refuses to start at all ("Failed to initialize
    # server(s) addr"), taking down the whole proxy over ordinary container
    # churn elsewhere. "last" falls back to the last known-good address if
    # resolution fails, then "none" allows starting with no address yet
    # (health checks pick it up once it's reachable) instead of a hard
    # failure.
    default-server init-addr last,libc,none

# Pangolin terminates TLS itself (in traefik), so haproxy just balances
# raw TCP connections across the two cluster nodes: gerbil on ayame is
# reached over the internal "pangolin" docker network, michi is reached
# over the public internet on its published ports.

frontend web_front
    bind *:80
    default_backend web_back

backend web_back
    balance roundrobin
    server ayame gerbil:80 check
    server michi <MICHI_PUBLIC_IP>:80 check

frontend websecure_front
    bind *:443
    default_backend websecure_back

backend websecure_back
    balance roundrobin
    # TODO: a plain TCP check only proves Traefik's port is open, not that
    # the dashboard actually works behind it (confirmed live: stopping just
    # pangolin left this looking "up" while every request got a 502). An
    # HTTPS httpchk with check-ssl was tried and reverted - both servers
    # failed it with "SSL handshake failure" and took the whole backend
    # down. That was blamed on a Traefik TLS/ALPN bug inferred from curl
    # failing where openssl s_client succeeded; that theory turned out to
    # be wrong (curl was rejecting Traefik's self-signed fallback cert with
    # "unknown CA" - see README - and s_client doesn't validate by
    # default). Why check-ssl failed is still unexplained, since "verify
    # none" should accept a self-signed cert. Re-test against a node taken
    # out of rotation before trying this live again.
    server ayame gerbil:8443 check
    server michi <MICHI_PUBLIC_IP>:443 check

frontend dashboard_front
    bind *:3000
    default_backend dashboard_back

backend dashboard_back
    balance roundrobin
    server ayame gerbil:3000 check
    server michi <MICHI_PUBLIC_IP>:3000 check

# Test-only backend - deliberately not referenced by any frontend, so it
# carries no traffic and cannot cause an outage. It exists to validate an
# HTTPS health check against both nodes (watch its rows on the stats page)
# before that check is promoted onto websecure_back, since the last attempt
# to change that check live took 443 down for every user. Delete this once
# the check is either adopted or ruled out.
backend websecure_check_test
    balance roundrobin
    option httpchk
    http-check send meth GET uri /api/v1/ hdr Host <DASHBOARD_DOMAIN>
    http-check expect status 200
    # sni is the piece the earlier failed attempt lacked: without it the
    # check's ClientHello carries no server name, which is not what real
    # traffic looks like.
    server ayame gerbil:8443 check check-ssl verify none sni str(<DASHBOARD_DOMAIN>)
    server michi <MICHI_PUBLIC_IP>:443 check check-ssl verify none sni str(<DASHBOARD_DOMAIN>)

listen stats
    mode http
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
