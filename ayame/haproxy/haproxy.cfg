global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    tcp
    option  tcplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

# Pangolin terminates TLS itself (in traefik), so haproxy just balances
# raw TCP connections across the two cluster nodes: gerbil on ayame is
# reached over the internal "pangolin" docker network, michi is reached
# over the public internet on its published ports.

frontend web_front
    bind *:80
    default_backend web_back

backend web_back
    balance roundrobin
    server ayame gerbil:80 check
    server michi <MICHI_PUBLIC_IP>:80 check

frontend websecure_front
    bind *:443
    default_backend websecure_back

backend websecure_back
    balance roundrobin
    # A plain TCP check only proves Traefik's port is open, not that the
    # dashboard actually works behind it - confirmed live: stopping just
    # the pangolin container left Traefik itself listening fine, so this
    # backend kept looking "up" to a TCP check while every request through
    # it actually got a 502 (Pangolin unreachable behind Traefik). This
    # HTTPS check exercises the same route real dashboard traffic uses, so
    # it only stays "up" when pangolin itself is actually answering.
    option httpchk GET /api/v1/
    http-check send hdr Host <DASHBOARD_DOMAIN>
    http-check expect status 200
    server ayame gerbil:8443 check check-ssl verify none
    server michi <MICHI_PUBLIC_IP>:443 check check-ssl verify none

frontend dashboard_front
    bind *:3000
    default_backend dashboard_back

backend dashboard_back
    balance roundrobin
    server ayame gerbil:3000 check
    server michi <MICHI_PUBLIC_IP>:3000 check

listen stats
    mode http
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
