app:
  region: "region1"
  identity_provider_mode: "org"
redis:
  host: "redis"
  port: 6379
flags:
  enable_redis: true
  use_pangolin_dns: true
acme:
  cert_mode: "pangolin"
  contact_email: "<CONTACT_EMAIL>"
  enable_acme_client: true
dns:
  enabled: true
  nameserver_name: "ns.example.com"
  cname_extension: "cname.example.com"
  site_extension: "site.example.com" # Optional
  # Pangolin's DNS server only ever answers with an A record for a name
  # that's a resource or a login page - it never generates one for the
  # bare dashboard domain itself. Once that domain's NS is delegated to
  # this nameserver, nothing else can serve that record either, so
  # without this it's a permanent NXDOMAIN. This is the DNS-layer
  # counterpart of config/dynamic/bootstrap.yml (which solves the same
  # gap for Traefik routing).
  # Each resource hostname also needs an entry here, pointing at the
  # HAProxy host rather than an exit node. Pangolin's DNS otherwise answers
  # a resource with one exit node's IP, picked by hashing the hostname, so
  # clients pin to a single node and never reach the load balancer - which
  # defeats draining a node for updates. Static records are matched before
  # resource records and win outright, but only on an exact hostname
  # match: one entry per resource, added whenever a resource is added.
  static_records:
    - domain: "<DASHBOARD_DOMAIN>"
      type: "A"
      value: "<AYAME_PUBLIC_IP>"
    - domain: "<RESOURCE_DOMAIN>"
      type: "A"
      value: "<AYAME_PUBLIC_IP>"
