http:
  routers:
    bootstrap-dashboard-api:
      rule: "Host(`<DASHBOARD_DOMAIN>`) && PathPrefix(`/api/v1`)"
      entryPoints:
        - websecure
      service: bootstrap-dashboard-api-svc
      priority: 1000
      tls: {}
    bootstrap-dashboard-ui:
      rule: "Host(`<DASHBOARD_DOMAIN>`)"
      entryPoints:
        - websecure
      service: bootstrap-dashboard-ui-svc
      priority: 999
      tls: {}
  services:
    bootstrap-dashboard-api-svc:
      loadBalancer:
        servers:
          - url: "http://pangolin:3000"
    bootstrap-dashboard-ui-svc:
      loadBalancer:
        servers:
          - url: "http://pangolin:3002"

# NO tls.certificates block here on purpose.
#
# There used to be one, pointing at a janitor-proof copy in
# /var/dashboard-cert, because Pangolin's cert janitor deletes the
# dashboard domain's cert from certificates_path on any node where no
# active exit node claims that domain - leaving Traefik on its self-signed
# fallback, which real clients reject outright.
#
# Now that a site is pinned to each node (see README, "Rolling pangolin
# updates"), both nodes claim the domain and Pangolin's own pipeline keeps
# the cert current in cert_config.yml. Defining it here as well made
# Traefik log `TLS certificate {...} already configured, skipping
# origin=cert_config.yml` on every reload - dumping the full certificate
# AND PRIVATE KEY into the container log - and, worse, meant Traefik served
# the static copy while ignoring the managed one, so a renewal would never
# have reached clients.
#
# If a node ever loses its claim on the domain again (its site goes offline
# for long enough), restore the block below and repopulate
# cert-sync/dashboard-cert/. The mount is still in place for that.
#
# tls:
#   certificates:
#     - certFile: /var/dashboard-cert/cert.pem
#       keyFile: /var/dashboard-cert/key.pem
