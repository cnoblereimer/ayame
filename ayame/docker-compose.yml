name: pangolin
services:
  # Inter-node link for Postgres and Redis. network_mode: host is
  # load-bearing: the wg-cluster interface has to exist in the HOST
  # namespace for docker to publish those services on 10.88.0.1, and for
  # michi's containers to route to it.
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    # No sysctls block here: docker refuses namespaced sysctls under
    # network_mode: host (it would be setting the host's, not the
    # container's). wg-quick only needs src_valid_mark for fwmark-based
    # policy routing, which a point-to-point link like this does not use.
    # If it is ever needed, set it on the host instead:
    #   sysctl -w net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - ./wireguard:/config
      - /lib/modules:/lib/modules:ro # only needed if wireguard isn't built into the kernel
    healthcheck:
      # Postgres and Redis wait on this - without it they would try to bind
      # 10.88.0.1 before the interface exists and fail to start.
      test: ["CMD-SHELL", "wg show wg-cluster >/dev/null 2>&1"]
      interval: "10s"
      timeout: "5s"
      retries: 12
      start_period: "15s"

  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Bound to ayame's WireGuard address only, so this never listens on a
      # public interface. Requires wg-quick@wg-cluster to be up before
      # docker starts the container - see README, "Private network between
      # the nodes".
      - "10.88.0.1:5432:5432"
    depends_on:
      wireguard:
        condition: service_healthy
    restart: always

  redis:
    image: redis:latest
    container_name: redis
    ports:
      # Same as postgres: WireGuard address only. This one matters more -
      # Redis takes no password, so network reachability is the whole of
      # its access control.
      - "10.88.0.1:6379:6379"
    depends_on:
      wireguard:
        condition: service_healthy
    restart: always

  haproxy:
    image: haproxy:3.4-alpine
    container_name: haproxy
    restart: unless-stopped
    depends_on:
      - gerbil
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      # Holds the runtime API socket, so a node can be drained from the
      # host before it is taken down for updates (see README).
      - ./haproxy/run:/var/run/haproxy
    ports:
      - "80:80"
      - "443:443"
      - "3000:3000" # pangolin dashboard, load balanced across both nodes
      - "8404:8404" # haproxy stats page

  pangolin:
    image: docker.io/fosrl/pangolin:ee-postgresql-latest
    container_name: pangolin
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    volumes:
      - ./config:/app/config
      - ./config/certificates:/var/certificates
      - ./config/dynamic:/var/dynamic
    ports:
      # Published directly on pangolin, not gerbil: gerbil's own port 53
      # publish does not correctly relay queries to pangolin's embedded
      # DNS server (confirmed by querying pangolin:53 directly over the
      # internal docker network, which answers correctly, vs. the
      # host's public port 53 via gerbil, which returned SERVFAIL).
      - "53:53/udp"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/v1/"]
      interval: "10s"
      timeout: "10s"
      retries: 15

  gerbil:
    image: docker.io/fosrl/gerbil:latest
    container_name: gerbil
    restart: unless-stopped
    depends_on:
      pangolin:
        condition: service_healthy
    command:
      - --reachableAt=http://<AYAME_PUBLIC_IP>:3004
      - --generateAndSaveKeyTo=/var/config/key
      - --remoteConfig=http://pangolin:3001/api/v1/
      - --trusted-upstreams=<AYAME_PUBLIC_IP>,<MICHI_PUBLIC_IP>
    volumes:
      - ./config/:/var/config
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    ports:
      - 51820:51820/udp # wireguard
      - 21820:21820/udp # relay
      - 3004:3004 # gerbil control API - needs to be reachable from michi
      # DNS (53/udp) is published on the pangolin service instead - see
      # its ports comment.
      # 80/443/3000 are intentionally NOT published here: haproxy reaches
      # this node over the internal "pangolin" docker network instead
      # (gerbil:80, gerbil:8443, gerbil:3000), since haproxy already owns
      # those ports on the host.

  traefik:
    image: docker.io/traefik:v3.7.11
    container_name: traefik
    restart: unless-stopped
    network_mode: service:gerbil # ports appear on the gerbil service
    depends_on:
      pangolin:
        condition: service_healthy
    command:
      - --configFile=/etc/traefik/traefik_config.yml
    volumes:
      - ./config/traefik:/etc/traefik:ro
      - ./config/traefik/logs:/var/log/traefik
      - ./config/certificates:/var/certificates:ro
      - ./config/dynamic:/var/dynamic:ro
      # Separate from /var/certificates on purpose, same reason as on michi:
      # Pangolin's cert janitor force-deletes any directory under
      # certificates_path for a domain no active exit node claims, and
      # nothing claims the bare dashboard domain - so the dashboard cert
      # cannot live there on either node. This directory is never scanned.
      - ./cert-sync/dashboard-cert:/var/dashboard-cert:ro

networks:
  default:
    driver: bridge
    name: pangolin

volumes:
  postgres_data:
