providers:
  file:
    directory: "/var/dynamic"
    watch: true

experimental:
  plugins:
    badger:
      moduleName: "github.com/fosrl/badger"
      version: "v1.7.0"

log:
  level: "INFO"
  format: "common"
  maxSize: 100
  maxBackups: 3
  maxAge: 3
  compress: true

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"
    proxyProtocol: # We trust gerbil upstream
      trustedIPs:
        - 0.0.0.0/0
        - ::1/128
    transport:
      respondingTimeouts:
        readTimeout: "30m"
    http:
      encodedCharacters:
        allowEncodedSlash: true
        allowEncodedQuestionMark: true
  dashboard:
    address: ":3000"
  dns:
    address: ":53/udp"

serversTransport:
  insecureSkipVerify: true

ping:
  entryPoint: "web"

# Native Traefik ACME (HTTP-01), used only for the dashboard domain via
# bootstrap.yml's certResolver reference. Pangolin's own cert-sync pipeline
# (cert_mode: pangolin) issues certs fine but never deploys them to a file
# Traefik can load - this sidesteps that entirely for the one domain that
# matters before any real resources exist. Resources added later still go
# through Pangolin's own system, unaffected.
certificatesResolvers:
  letsencrypt:
    acme:
      email: "<CONTACT_EMAIL>"
      storage: "/var/certificates/acme.json"
      httpChallenge:
        entryPoint: "web"
