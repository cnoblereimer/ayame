http:
  routers:
    bootstrap-dashboard-api:
      rule: "Host(`<DASHBOARD_DOMAIN>`) && PathPrefix(`/api/v1`)"
      entryPoints:
        - websecure
      service: bootstrap-dashboard-api-svc
      priority: 1000
      tls: {}
    bootstrap-dashboard-ui:
      rule: "Host(`<DASHBOARD_DOMAIN>`)"
      entryPoints:
        - websecure
      service: bootstrap-dashboard-ui-svc
      priority: 999
      tls: {}
  services:
    bootstrap-dashboard-api-svc:
      loadBalancer:
        servers:
          - url: "http://pangolin:3000"
    bootstrap-dashboard-ui-svc:
      loadBalancer:
        servers:
          - url: "http://pangolin:3002"

# Pangolin's own certificate pipeline is scoped per exit node - it only
# fetches/writes a cert for a domain if a resource or login page on THIS
# node's exit node needs it (see TraefikConfigManager.ts). No resource is
# pinned to michi's exit node, so that pipeline never runs here and this
# node would otherwise only ever have Traefik's self-signed fallback cert
# for the dashboard domain. This entry points at a copy of ayame's real
# wildcard cert kept up to date by a cron/systemd-timer job on michi (see
# README: "Why the dashboard cert is synced from ayame") - Traefik reloads
# it automatically whenever the referenced files' content changes, so nothing
# here needs to change when the cert renews.
#
# Deliberately NOT under /var/certificates: that directory is also
# Pangolin's own certificate store, and its janitor process force-deletes
# any domain directory there that isn't one of THIS node's own active
# domains (michi never has one), typically within ~15 seconds. This path
# is a separate bind mount (see docker-compose.yml) that Pangolin never
# scans.
tls:
  certificates:
    - certFile: /var/dashboard-cert/cert.pem
      keyFile: /var/dashboard-cert/key.pem
