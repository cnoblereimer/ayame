app:
  region: "region1"
  identity_provider_mode: "org"
redis:
  host: "<AYAME_PUBLIC_IP>"
  port: 6379
flags:
  enable_redis: true
  use_pangolin_dns: true
acme:
  cert_mode: "pangolin"
  contact_email: "<CONTACT_EMAIL>"
  enable_acme_client: true
dns:
  enabled: true
  nameserver_name: "ns.example.com"
  cname_extension: "cname.example.com"
  site_extension: "site.example.com" # Optional
  # Kept in sync with ayame's config/privateConfig.yml - see the comment
  # there. Only ayame's DNS server is publicly reachable today, but this
  # keeps michi's answer consistent if that ever changes.
  # Must match ayame's list exactly - either node may answer a query, and
  # a resource hostname missing here would resolve to a single exit node
  # instead of the load balancer. See ayame's copy for why.
  static_records:
    - domain: "<DASHBOARD_DOMAIN>"
      type: "A"
      value: "<AYAME_PUBLIC_IP>"
    - domain: "<RESOURCE_DOMAIN>"
      type: "A"
      value: "<AYAME_PUBLIC_IP>"
