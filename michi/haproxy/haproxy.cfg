global
    log stdout format raw local0
    maxconn 4096
    # Runtime API, for draining a node before taking it down for updates
    # instead of letting the health check discover it a few seconds later
    # (which costs a couple of 502s - measured). Deliberately a unix socket
    # on a bind mount rather than "stats admin" on the :8404 page, which is
    # published publicly. See README, "Rolling pangolin updates".
    stats socket /var/run/haproxy/admin.sock mode 660 level admin

defaults
    log     global
    mode    tcp
    option  tcplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    # HAProxy resolves a server's hostname (e.g. "gerbil") once, at config
    # load time, by default - if that container happens to be mid-restart
    # right then, HAProxy refuses to start at all ("Failed to initialize
    # server(s) addr"), taking down the whole proxy over ordinary container
    # churn elsewhere. "last" falls back to the last known-good address if
    # resolution fails, then "none" allows starting with no address yet
    # (health checks pick it up once it's reachable) instead of a hard
    # failure.
    default-server init-addr last,libc,none

# This node's half of a symmetric pair: ayame runs the same thing. Each
# node's DNS record points clients at its own load balancer, and each load
# balancer can serve from either node, so neither is a single point of
# ingress.
#
# The peer is reached at its GERBIL ports over the tunnel (8080/8444/8300),
# never at its public 80/443/3000 - those belong to the peer's haproxy, and
# pointing here would let the two load balancers bounce a request back and
# forth between them indefinitely.

frontend web_front
    bind *:80
    default_backend web_back

backend web_back
    balance roundrobin
    # Checked against the HTTPS endpoint via "port", not port 80 itself: a
    # TCP check here only proves Traefik is listening, and Traefik answers
    # port 80 with a redirect generated by itself, so neither proves
    # pangolin is alive behind it. Confirmed live - with pangolin stopped
    # on ayame, websecure_back correctly went DOWN while this backend and
    # dashboard_back still reported UP and kept routing into a dead node.
    option httpchk
    http-check send meth GET uri /api/v1/ hdr Host <DASHBOARD_DOMAIN>
    http-check expect status 200
    server michi gerbil:80 check port 8443 check-ssl verify none sni str(<DASHBOARD_DOMAIN>) inter 1s fall 2 rise 2
    server ayame 10.88.0.1:8080 check port 8444 check-ssl verify none sni str(<DASHBOARD_DOMAIN>) inter 1s fall 2 rise 2

frontend websecure_front
    bind *:443
    # Everything is balanced across both nodes, which requires every
    # resource to be dual-homed: a target on the site pinned to ayame AND
    # a target on the site pinned to michi (see README, "Rolling pangolin
    # updates"). A resource with only one target is served by one node,
    # and balancing it sends half its traffic to a node that has no router
    # for it and answers 404. There was an SNI split here that pinned
    # resources to ayame for exactly that reason; it is unnecessary once
    # both sites exist, but add it back if a single-homed resource ever
    # has to be supported.
    default_backend websecure_back

backend websecure_back
    balance roundrobin
    # A plain TCP check here only proved Traefik's port was open, not that
    # the dashboard worked behind it: with pangolin stopped, Traefik kept
    # listening and this backend kept looking healthy while every request
    # routed to it got a 502. This check makes the same request real
    # dashboard traffic makes, so it only reports up when pangolin is
    # actually answering behind Traefik.
    #
    # An earlier attempt at this failed both servers at once ("SSL
    # handshake failure") and took 443 down for everyone. It was missing
    # "sni": without it the check's ClientHello carries no server name,
    # which is not what real traffic looks like. Validated before adoption
    # on a traffic-free test backend, with pangolin stopped on ayame: ayame
    # correctly went DOWN, michi stayed UP.
    option httpchk
    http-check send meth GET uri /api/v1/ hdr Host <DASHBOARD_DOMAIN>
    http-check expect status 200
    # inter/fall tightened from the defaults (2s/3, ~6s to notice): an
    # unplanned pangolin death is caught in ~2s instead. A *planned* one
    # should still be drained via the runtime socket first, which costs
    # nothing at all.
    server michi gerbil:8443 check check-ssl verify none sni str(<DASHBOARD_DOMAIN>) inter 1s fall 2 rise 2
    server ayame 10.88.0.1:8444 check check-ssl verify none sni str(<DASHBOARD_DOMAIN>) inter 1s fall 2 rise 2

frontend dashboard_front
    bind *:3000
    default_backend dashboard_back

backend dashboard_back
    balance roundrobin
    # Same as web_back: checked against the HTTPS endpoint rather than
    # port 3000, so a dead pangolin behind a live Traefik is detected.
    option httpchk
    http-check send meth GET uri /api/v1/ hdr Host <DASHBOARD_DOMAIN>
    http-check expect status 200
    server michi gerbil:3000 check port 8443 check-ssl verify none sni str(<DASHBOARD_DOMAIN>) inter 1s fall 2 rise 2
    server ayame 10.88.0.1:8300 check port 8444 check-ssl verify none sni str(<DASHBOARD_DOMAIN>) inter 1s fall 2 rise 2

listen stats
    mode http
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
