# michi's half of the inter-node WireGuard link. See
# ayame/wireguard/wg_confs/wg-cluster.conf for the full notes - this is the
# mirror image of it, brought up by the "wireguard" service in this host's
# docker-compose.yml.
#
# No PrivateKey line on purpose; create the key file once on this host:
#
#   cd /opt/pangolin-cluster
#   umask 077 && wg genkey | sudo tee wireguard/privatekey | wg pubkey
#
# The printed PUBLIC key goes in ayame's config as the peer key.

[Interface]
Address = 10.88.0.2/30
ListenPort = 51821
PostUp = wg set %i private-key /config/privatekey

[Peer]
# ayame - Postgres and Redis live behind this address
PublicKey = <AYAME_WG_PUBLIC_KEY>
AllowedIPs = 10.88.0.1/32
Endpoint = <AYAME_PUBLIC_IP>:51821
PersistentKeepalive = 25
