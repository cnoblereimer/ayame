name: pangolin
services:
  pangolin:
    image: docker.io/fosrl/pangolin:ee-postgresql-latest
    container_name: pangolin
    restart: unless-stopped
    volumes:
      - ./config:/app/config
      - ./config/certificates:/var/certificates
      - ./config/dynamic:/var/dynamic
    ports:
      # Published directly on pangolin, not gerbil: gerbil's own port 53
      # publish does not correctly relay queries to pangolin's embedded
      # DNS server (confirmed on ayame by querying pangolin:53 directly
      # over the internal docker network, which answers correctly, vs.
      # the host's public port 53 via gerbil, which returned SERVFAIL).
      - "53:53/udp"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/v1/"]
      interval: "10s"
      timeout: "10s"
      retries: 15

  gerbil:
    image: docker.io/fosrl/gerbil:latest
    container_name: gerbil
    restart: unless-stopped
    depends_on:
      pangolin:
        condition: service_healthy
    command:
      - --reachableAt=http://<MICHI_PUBLIC_IP>:3004
      - --generateAndSaveKeyTo=/var/config/key
      - --remoteConfig=http://pangolin:3001/api/v1/
      - --trusted-upstreams=<AYAME_PUBLIC_IP>,<MICHI_PUBLIC_IP>
    volumes:
      - ./config/:/var/config
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    ports:
      - 51820:51820/udp # wireguard
      - 21820:21820/udp # relay
      # DNS (53/udp) is published on the pangolin service instead - see
      # its ports comment.
      - 443:8443 # resources - haproxy on ayame connects here directly
      - 80:80 # web - haproxy on ayame connects here directly
      - 3004:3004 # gerbil control API - needs to be reachable from ayame
      - 3000:3000 # pangolin dashboard - haproxy on ayame connects here directly

  traefik:
    image: docker.io/traefik:v3.7.11
    container_name: traefik
    restart: unless-stopped
    network_mode: service:gerbil # ports appear on the gerbil service
    depends_on:
      pangolin:
        condition: service_healthy
    command:
      - --configFile=/etc/traefik/traefik_config.yml
    volumes:
      - ./config/traefik:/etc/traefik:ro
      - ./config/traefik/logs:/var/log/traefik
      - ./config/certificates:/var/certificates:ro
      - ./config/dynamic:/var/dynamic:ro
      # Separate from /var/certificates on purpose: Pangolin's own cert
      # janitor (cleanupUnusedCertificates in TraefikConfigManager.ts)
      # force-deletes any directory under certificates_path that isn't one
      # of THIS node's own currently-active domains, with only a ~15s grace
      # period. Michi never has an active domain of its own, so anything
      # synced into /var/certificates would get deleted moments after
      # landing there. This directory is never scanned by that logic.
      - ./cert-sync/synced-certs:/var/dashboard-cert:ro

networks:
  default:
    driver: bridge
    name: pangolin
